; ── Catppuccin Mocha ────────────────────────────────────────
[colors]
base     = #E61e1e2e
mantle   = #181825
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
text     = #cdd6f4
subtext  = #a6adc8
pink     = #f5c2e7
mauve    = #cba6f7
red      = #f38ba8
peach    = #fab387
yellow   = #f9e2af
green    = #a6e3a1
teal     = #94e2d5
blue     = #89b4fa
lavender = #b4befe
debian   = #f38ba8


[bar/bar1]
monitor = ${env:MONITOR:}
; Ancho = monitor - 2*window_gap, alineado con las ventanas de bspwm
width = 100%:-24
height = 34
offset-x = 12
offset-y = 10
radius = 10.0
fixed-center = true

background = ${colors.base}
foreground = ${colors.text}

line-size = 2
border-size = 0

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

separator = "%{F#45475a}│%{F-}"

font-0 = FiraCode Nerd Font:style=Medium:pixelsize=13;3
font-1 = Noto Sans CJK JP:style=Bold:pixelsize=13;3
font-2 = FiraCode Nerd Font:pixelsize=17;4

modules-left = debian-logo bspwm spotify
modules-center = date
modules-right = cpu memory volume bluetooth wifi-custom

cursor-click = pointer
cursor-scroll = ns-resize

wm-restack = bspwm
override-redirect = false


[module/debian-logo]
type = custom/text
format = %{T3}󰣚%{T-}
format-foreground = ${colors.debian}
format-padding = 1
click-left = rofi -show drun


[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-scroll = true

format = <label-state> <label-mode>

label-focused = %{T2}%name%%{T-}
label-focused-foreground = ${colors.pink}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.pink}
label-focused-padding = 2

label-occupied = %{T2}%name%%{T-}
label-occupied-foreground = ${colors.lavender}
label-occupied-padding = 2

label-urgent = %{T2}%name%%{T-}
label-urgent-foreground = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 2

label-empty = %{T2}%name%%{T-}
label-empty-foreground = ${colors.surface1}
label-empty-padding = 2


[module/spotify]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh
interval = 5
format = <label>
format-prefix = "%{T3}󰝚%{T-} "
format-prefix-foreground = ${colors.green}
label = %output:0:40:…%


[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
format = <label>
label = %{F#cba6f7}%{T3}󰃭%{T-}%{F-} %date%   %{F#89b4fa}%{T3}󰥔%{T-}%{F-} %time%


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T3}󰻠%{T-} "
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%


[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{T3}󰍛%{T-} "
format-prefix-foreground = ${colors.yellow}
label = %percentage_used:2%%


[module/volume]
type = internal/alsa
format-volume = <label-volume>
format-volume-prefix = "%{T3}󰕾%{T-} "
format-volume-prefix-foreground = ${colors.teal}
label-volume = %percentage%%
format-muted-prefix = "%{T3}󰝟%{T-} "
format-muted-prefix-foreground = ${colors.overlay0}
label-muted = mute
label-muted-foreground = ${colors.overlay0}


[module/bluetooth]
type = custom/script
exec = ~/.config/bspwm/scripts/rofi-bluetooth.sh --status
interval = 10
format-foreground = ${colors.blue}
label = %output%
click-left = ~/.config/bspwm/scripts/rofi-bluetooth.sh


[module/wifi-custom]
type = custom/script
exec = ~/.config/bspwm/scripts/wifi_status.sh
interval = 5
format-foreground = ${colors.mauve}
label = %{T3}%output%%{T-}
click-left = ~/.config/bspwm/scripts/rofi-wifi-menu.sh


[settings]
screenchange-reload = true
pseudo-transparency = false
