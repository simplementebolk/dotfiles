; ── Catppuccin Mocha + acento rojo del fondo (lirios) ───────
[colors]
accent   = #e5484d
gold     = #f0b44c
base     = #E6181825
mantle   = #181825
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
text     = #cdd6f4
subtext  = #a6adc8
pink     = #f5c2e7
mauve    = #cba6f7
red      = #f38ba8
peach    = #fab387
yellow   = #f9e2af
green    = #a6e3a1
teal     = #94e2d5
blue     = #89b4fa
lavender = #b4befe
debian   = #e5484d


[bar/bar1]
monitor = ${env:MONITOR:}
; Ancho = monitor - 2*window_gap, alineado con las ventanas de bspwm
width = 100%:-24
height = 34
offset-x = 12
offset-y = 10
radius = 10.0
fixed-center = true

background = ${colors.base}
foreground = ${colors.text}

line-size = 2
border-size = 0

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

separator = "%{F#45475a}│%{F-}"

font-0 = FiraCode Nerd Font:style=Medium:pixelsize=13;3
font-1 = Noto Sans CJK JP:style=Bold:pixelsize=13;3
font-2 = FiraCode Nerd Font:pixelsize=17;4

modules-left = debian-logo bspwm music
modules-center = date
modules-right = cpu cpu-temp memory volume bluetooth network

cursor-click = pointer
cursor-scroll = ns-resize

wm-restack = bspwm
override-redirect = false


[module/debian-logo]
type = custom/text
format = %{T3}󰣚%{T-}
format-foreground = ${colors.debian}
format-padding = 1
click-left = rofi -show drun
click-right = ~/.config/bspwm/scripts/powermenu.sh


[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-scroll = true

format = <label-state> <label-mode>

label-focused = %{T2}%name%%{T-}
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.accent}
label-focused-padding = 2

label-occupied = %{T2}%name%%{T-}
label-occupied-foreground = ${colors.subtext}
label-occupied-padding = 2

label-urgent = %{T2}%name%%{T-}
label-urgent-foreground = ${colors.gold}
label-urgent-underline = ${colors.gold}
label-urgent-padding = 2

label-empty = %{T2}%name%%{T-}
label-empty-foreground = ${colors.surface1}
label-empty-padding = 2


[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
tail = true
interval = 5
label = %output%
click-left = playerctl play-pause
click-right = playerctl next
scroll-up = playerctl previous
scroll-down = playerctl next


[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
; click-left no funciona en módulos internal/*: se usa una acción %{A1} propia
format = %{A1:~/.config/bspwm/scripts/popup-calendar.sh --popup &:}<label>%{A}
label = %{F#e5484d}%{T3}󰃭%{T-}%{F-} %date%   %{F#f0b44c}%{T3}󰥔%{T-}%{F-} %time%


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T3}󰻠%{T-} "
format-prefix-foreground = ${colors.subtext}
label = %percentage:2%%


[module/cpu-temp]
type = custom/script
exec = ~/.config/polybar/scripts/cpu-temp.sh
interval = 5
label = %output%


[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{T3}󰍛%{T-} "
format-prefix-foreground = ${colors.subtext}
label = %percentage_used:2%%


[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
; Clic izq: panel de audio · Clic der: silenciar · Scroll: volumen
; (las acciones %{A} internas tienen prioridad sobre las del módulo)
format-volume = %{A1:~/.config/polybar/scripts/rofi-audio.sh &:}%{A3:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle:}<label-volume>%{A}%{A}
label-volume = %{F#a6adc8}%{T3}󰕾%{T-}%{F-} %percentage%%
format-muted = %{A1:~/.config/polybar/scripts/rofi-audio.sh &:}%{A3:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle:}<label-muted>%{A}%{A}
label-muted = %{T3}󰝟%{T-} mute
label-muted-foreground = ${colors.overlay0}


[module/bluetooth]
type = custom/script
exec = ~/.config/bspwm/scripts/rofi-bluetooth.sh --status
interval = 10
label = %output%
click-left = ~/.config/bspwm/scripts/rofi-bluetooth.sh


[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
label = %output%
click-left = ~/.config/bspwm/scripts/rofi-wifi-menu.sh


[settings]
screenchange-reload = true
pseudo-transparency = false
