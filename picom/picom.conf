# ── Backend ───────────────────────────────────────────────
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

# ── Esquinas redondeadas ──────────────────────────────────
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "fullscreen"
];

# ── Sombras ───────────────────────────────────────────────
shadow = true;
shadow-radius = 18;
shadow-offset-x = -15;
shadow-offset-y = -12;
shadow-opacity = 0.45;
shadow-color = "#11111b";
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'ksnip'",
    "fullscreen"
];

# ── Desenfoque (fondo de ventanas translúcidas) ──────────
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'ksnip'",
    "class_g = 'firefox' && argb"
];

# ── Animación de aparición ───────────────────────────────
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# ── Transparencias ───────────────────────────────────────
# (Polybar ya usa un fondo ARGB, no necesita regla aquí)
inactive-opacity = 1.0;
active-opacity = 1.0;
opacity-rule = [
    "90:class_g = 'jetbrains-idea-ce'",
    "90:class_g = 'jetbrains-studio'",
    "88:class_g = 'Spotify'",
    "92:class_g = 'discord'",
    "92:class_g = 'Code'",
    "100:class_g = 'firefox'"
];
